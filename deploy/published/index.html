<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>No publication available</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f2ed;
        color: #25231f;
        --muted: #68645d;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 64px);
        background: #f4f2ed;
        color: #25231f;
      }
      main {
        width: min(100%, 38rem);
        padding-block: clamp(24px, 6vw, 56px);
      }
      h1 {
        max-width: 20ch;
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        font-weight: 720;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      p {
        max-width: 52ch;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      @media (max-width: 360px) {
        body {
          place-items: start;
        }
        main {
          padding-top: 32px;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #191815;
          color: #f4f2ed;
          --muted: #c2bdb3;
        }
        body {
          background: #191815;
          color: #f4f2ed;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>No publication is available</h1>
      <p>No walkthrough has been published here yet. Check the address or try again later.</p>
    </main>
  </body>
</html>
