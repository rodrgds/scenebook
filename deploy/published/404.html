<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f5f6;
        color: #1c1d1f;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f4f5f6;
      }
      main {
        width: min(100%, 40rem);
        padding: clamp(28px, 6vw, 56px);
        border: 1px solid #dfe2e5;
        border-radius: 20px;
        background: #fff;
      }
      h1 {
        max-width: 18ch;
        margin: 0;
        font-family: ui-serif, Charter, Georgia, serif;
        font-size: clamp(2rem, 7vw, 3.5rem);
        line-height: 1;
        letter-spacing: -0.03em;
      }
      p {
        max-width: 52ch;
        margin: 20px 0 0;
        color: #5f646b;
        font-size: 1.0625rem;
        line-height: 1.65;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 10px 16px;
        border-radius: 10px;
        background: #1c1d1f;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #2459d1;
        outline-offset: 3px;
      }
      @media (prefers-color-scheme: dark) {
        :root,
        body {
          background: #161719;
          color: #f4f5f6;
        }
        main {
          border-color: #36393d;
          background: #202225;
        }
        p {
          color: #b8bdc3;
        }
        a {
          background: #f4f5f6;
          color: #1c1d1f;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The address may have changed, or this page is no longer part of the publication.</p>
      <a href="/">Go to the publication home</a>
    </main>
  </body>
</html>
