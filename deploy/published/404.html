<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
        background: #f4f2ed;
        color: #25231f;
        --muted: #68645d;
        --accent: #a6402d;
        --accent-hover: #843322;
        --focus: #2459d1;
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: clamp(20px, 5vw, 64px);
        background: #f4f2ed;
        color: #25231f;
      }
      main {
        width: min(100%, 38rem);
        padding-block: clamp(24px, 6vw, 56px);
      }
      h1 {
        max-width: 20ch;
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.25rem);
        font-weight: 720;
        line-height: 1.05;
        letter-spacing: -0.035em;
      }
      p {
        max-width: 52ch;
        margin: 18px 0 0;
        color: var(--muted);
        font-size: 1.0625rem;
        line-height: 1.6;
      }
      a {
        display: inline-flex;
        min-height: 44px;
        align-items: center;
        justify-content: center;
        margin-top: 28px;
        padding: 10px 16px;
        border: 1px solid transparent;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        background: var(--accent-hover);
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 3px;
      }
      @media (max-width: 360px) {
        body {
          place-items: start;
        }
        main {
          padding-top: 32px;
        }
        a {
          width: 100%;
        }
      }
      @media (prefers-color-scheme: dark) {
        :root {
          background: #191815;
          color: #f4f2ed;
          --muted: #c2bdb3;
          --accent: #cf5a43;
          --accent-hover: #e06d56;
          --focus: #8eb7ff;
        }
        body {
          background: #191815;
          color: #f4f2ed;
        }
        a {
          color: #191815;
        }
      }
      @media (forced-colors: active) {
        a {
          border-color: ButtonText;
          background: ButtonFace;
          color: ButtonText;
        }
        a:focus-visible {
          outline-color: Highlight;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Page not found</h1>
      <p>The address may have changed, or this page is no longer part of the publication.</p>
      <a href="/">Go to the publication home</a>
    </main>
  </body>
</html>
