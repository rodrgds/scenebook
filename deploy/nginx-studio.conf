worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  server_tokens off;
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;
    set $cloud_upstream http://cloud:4310;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # SvelteKit emits a build-bound hash CSP in index.html. Keep frame embedding protection in an
    # HTTP header because frame-ancestors is ignored in meta policies; a second script-src policy
    # here would intersect with and accidentally block SvelteKit's hashed bootstrap.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    location ~* \.(?:css|js|mjs|png|jpe?g|gif|webp|avif|svg|woff2?)$ {
      try_files $uri =404;
      expires 1y;
      add_header Cache-Control "public, immutable";
      add_header X-Content-Type-Options nosniff always;
      add_header Referrer-Policy no-referrer always;
      add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
      add_header Content-Security-Policy "frame-ancestors 'self'" always;
    }

    location /v1/ {
      proxy_pass $cloud_upstream;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Request-ID $request_id;
      proxy_set_header Authorization $http_authorization;
      proxy_request_buffering off;
      client_max_body_size 260m;
    }

    location = /healthz { proxy_pass $cloud_upstream$request_uri; }
    location = /readyz { proxy_pass $cloud_upstream$request_uri; }
    location / { try_files $uri $uri/ /index.html; }
  }
}
