name: Version public packages

on:
  push:
    branches: [main]
    paths:
      - '.changeset/**'
      - 'package.json'
      - 'packages/**'
      - 'scripts/release-packages.ts'
      - 'scripts/sync-release-metadata.ts'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-public-packages
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - name: Require owner-configured release metadata
        run: bun run release:metadata:check
      - name: Open or update the Changesets version pull request
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: bun run release:version
          title: 'release: version public packages'
          commit: 'release: version public packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
