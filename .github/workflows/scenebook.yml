name: Scenebook journeys

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@scenebook/cli
      - run: bunx playwright install --with-deps chromium
      - name: Install local OCR gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tesseract-ocr
      - name: Assess sanitized publication derivatives
        working-directory: examples/acme-product
        run: bun ../../packages/cli/src/bin.ts privacy scan --config scenebook.config.ts
      - uses: ./
        with:
          working-directory: examples/acme-product
          config: scenebook.config.ts
          version: 0.1.0
