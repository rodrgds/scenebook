name: Scenebook journeys

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  journeys:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.3
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=@scenebook/cli
      - run: bunx playwright install --with-deps chromium
      - name: Install local OCR gate
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg tesseract-ocr
      - name: Assess sanitized publication derivatives
        working-directory: examples/acme-product
        run: node ../../packages/cli/dist/bin.js privacy scan --config scenebook.config.ts
      - name: Seed a reviewed self-test baseline
        working-directory: examples/acme-product
        run: |
          set +e
          node ../../packages/cli/dist/bin.js ci --config scenebook.config.ts --provider tesseract
          seed_exit_code="$?"
          set -e
          if [[ "$seed_exit_code" -ne 2 ]]; then
            echo "Expected the first baseline-free verification to report reviewable change (2), received $seed_exit_code." >&2
            exit 1
          fi
          run_reference="$(node -e '
            const { readFileSync } = require("node:fs");
            const build = JSON.parse(readFileSync(".scenebook/runs/build.json", "utf8"));
            const paths = build.runs
              .map((entry) => entry?.run?.path)
              .filter((value) => typeof value === "string");
            if (paths.length !== 1) {
              console.error(`Expected one complete Run reference, received ${paths.length}.`);
              process.exit(1);
            }
            process.stdout.write(paths[0]);
          ')"
          if [[ ! "$run_reference" =~ ^runs/[A-Za-z0-9._-]+\.json$ ]]; then
            echo "Reporter returned an unsafe Run reference." >&2
            exit 1
          fi
          node ../../packages/cli/dist/bin.js baseline accept \
            ".scenebook/runs/$run_reference" \
            --config scenebook.config.ts \
            --actor github-action-self-test \
            --yes
      - uses: ./
        with:
          working-directory: examples/acme-product
          config: scenebook.config.ts
          version: 0.1.0
