version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 8
    groups:
      svelte:
        patterns: ['svelte', '@sveltejs/*']
      playwright:
        patterns: ['@playwright/*', 'playwright*']
      tooling:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
